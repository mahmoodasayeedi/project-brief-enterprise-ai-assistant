<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IronStore AI Assistant</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f4f5f7; color: #1f2933; }
  .app { max-width: 860px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; }
  header { padding: 18px 20px; background: #1e3a5f; color: #fff; }
  header h1 { margin: 0; font-size: 20px; }
  header p { margin: 4px 0 0; font-size: 13px; opacity: .8; }
  #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 85%; padding: 12px 16px; border-radius: 14px; line-height: 1.5; font-size: 15px; }
  .msg p { margin: 0 0 8px; } .msg p:last-child { margin-bottom: 0; }
  .user { align-self: flex-end; background: #1e3a5f; color: #fff; border-bottom-right-radius: 4px; }
  .bot { align-self: flex-start; background: #fff; border: 1px solid #e1e4e8; border-bottom-left-radius: 4px; }
  .meta { margin-top: 10px; font-size: 12px; color: #6b7280; }
  .meta details summary { cursor: pointer; }
  .meta ul { margin: 6px 0 0; padding-left: 18px; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 10px; background: #eef2f7; margin-right: 4px; }
  .current { color: #15803d; } .outdated { color: #b45309; }
  .typing { color: #6b7280; font-style: italic; }
  .suggestions { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 20px 10px; }
  .suggestions button { border: 1px solid #c9d2dc; background: #fff; border-radius: 16px; padding: 6px 12px; cursor: pointer; font-size: 13px; }
  form { display: flex; gap: 10px; padding: 14px 20px 20px; background: #f4f5f7; }
  input { flex: 1; padding: 12px 14px; border: 1px solid #c9d2dc; border-radius: 10px; font-size: 15px; }
  form button { padding: 0 20px; border: 0; border-radius: 10px; background: #1e3a5f; color: #fff; font-size: 15px; cursor: pointer; }
  form button:disabled { opacity: .5; cursor: wait; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>🏬 IronStore Enterprise AI Assistant</h1>
    <p>Ask about company policies, procedures and products. Answers come only from internal documents.</p>
  </header>
  <div id="chat"></div>
  <div class="suggestions" id="suggestions">
    <button>How do I request annual leave?</button>
    <button>What is the expense reimbursement process?</button>
    <button>What product is IS-BED-001?</button>
    <button>What are the password requirements?</button>
  </div>
  <form id="form">
    <input id="input" placeholder="Ask IronStore Assistant..." autocomplete="off" />
    <button id="send">Send</button>
  </form>
</div>
<script>
  const chat = document.getElementById("chat");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  const history = [];   // the browser remembers the conversation and sends it with every question

  function addMessage(role, html) {
    const div = document.createElement("div");
    div.className = "msg " + (role === "user" ? "user" : "bot");
    div.innerHTML = html;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }
  const md = (text) => DOMPurify.sanitize(marked.parse(text));
  const esc = (t) => t.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

  async function ask(question) {
    document.getElementById("suggestions").style.display = "none";
    addMessage("user", esc(question));
    const thinking = addMessage("bot", '<span class="typing">Searching company documents...</span>');
    send.disabled = true;
    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question, history }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || "Something went wrong");

      let meta = `<div class="meta"><span class="badge">🔀 ${data.route.difficulty}</span>`
               + `<span class="badge">🏢 ${data.route.department}</span><span class="badge">🤖 ${data.model}</span>`;
      if (data.sources.length) {
        meta += `<details><summary>📚 Sources (${data.sources.length})</summary><ul>`
              + data.sources.map(s => `<li>${esc(s.source.split(/[\\/]/).pop())} · ${s.date} · `
              + `<span class="${s.status}">${s.status}</span> · relevance ${s.score}</li>`).join("")
              + `</ul></details>`;
      }
      thinking.innerHTML = md(data.answer) + meta + "</div>";
      history.push({ role: "user", content: question }, { role: "assistant", content: data.answer });
    } catch (err) {
      thinking.innerHTML = "⚠️ " + esc(err.message);
    } finally {
      send.disabled = false;
      chat.scrollTop = chat.scrollHeight;
      input.focus();
    }
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const q = input.value.trim();
    if (!q) return;
    input.value = "";
    ask(q);
  });
  document.querySelectorAll("#suggestions button").forEach(b => b.addEventListener("click", () => ask(b.textContent)));
</script>
</body>
</html>
